name: Generate Comprehensive GitHub Stats

on:
    schedule:
        - cron: "0 */6 * * *" # Every 6 hours
    workflow_dispatch: # Allow manual triggering
    push:
        branches: [main]

jobs:
    generate-stats:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Generate GitHub Stats SVG
              uses: lowlighter/metrics@latest
              with:
                  token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
                  user: OliverPerring
                  template: classic
                  base: header, activity, community, repositories, metadata
                  config_timezone: Europe/London

                  # Include private repositories and organizations
                  plugin_isocalendar: yes
                  plugin_isocalendar_duration: full-year

                  # Language stats with ALL repos
                  plugin_languages: yes
                  plugin_languages_ignored: html, css, tex, less, dockerfile, makefile, qmake, lex, cmake, shell, gnuplot
                  plugin_languages_skipped: lowlighter
                  plugin_languages_details: bytes-size, percentage, lines
                  plugin_languages_sections: most-used, recently-used
                  plugin_languages_indepth: yes
                  plugin_languages_analysis_timeout: 15
                  plugin_languages_categories: markup, programming
                  plugin_languages_recent_categories: markup, programming
                  plugin_languages_recent_load: 300
                  plugin_languages_recent_days: 14

                  # Activity and contributions
                  plugin_activity: yes
                  plugin_activity_days: 14
                  plugin_activity_filter: all
                  plugin_activity_visibility: all
                  plugin_activity_timestamps: yes

                  # Notable contributions
                  plugin_notable: yes
                  plugin_notable_from: organization
                  plugin_notable_types: commit, pull_request, issue
                  plugin_notable_self: yes

                  # Traffic insights
                  plugin_traffic: yes

                  # Include all repositories (private, forks, etc.)
                  repositories_affiliations: owner, collaborator, organization_member
                  repositories_forks: yes

                  # Output settings
                  filename: assets/github-metrics.*
                  markdown: assets/README.md

                  # Custom CSS for theming
                  extras_css: |
                      h2, h3 { color: #58a6ff !important; }
                      .field { border-radius: 6px; }

            - name: Generate Detailed Activity Stats
              uses: lowlighter/metrics@latest
              with:
                  token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
                  user: OliverPerring
                  template: classic
                  base: ""

                  # Detailed commit activity
                  plugin_habits: yes
                  plugin_habits_from: 1000
                  plugin_habits_days: 14
                  plugin_habits_facts: yes
                  plugin_habits_charts: yes
                  plugin_habits_charts_type: classic
                  plugin_habits_trim: yes

                  # Lines of code
                  plugin_lines: yes
                  plugin_lines_history_limit: 1
                  plugin_lines_repositories_limit: 4
                  plugin_lines_sections: base

                  filename: assets/detailed-metrics.*

            - name: Generate Language Breakdown
              uses: lowlighter/metrics@latest
              with:
                  token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
                  user: OliverPerring
                  template: classic
                  base: ""

                  plugin_languages: yes
                  plugin_languages_ignored: html, css, tex, less, dockerfile, makefile, qmake, lex, cmake, shell, gnuplot
                  plugin_languages_details: bytes-size, percentage, lines
                  plugin_languages_sections: most-used
                  plugin_languages_indepth: yes
                  plugin_languages_analysis_timeout: 15
                  plugin_languages_categories: markup, programming
                  plugin_languages_recent_categories: markup, programming
                  plugin_languages_recent_load: 300
                  plugin_languages_recent_days: 30
                  plugin_languages_limit: 12

                  repositories_affiliations: owner, collaborator, organization_member
                  repositories_forks: yes

                  filename: assets/languages.*

            - name: Generate Organization Activity
              uses: lowlighter/metrics@latest
              with:
                  token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
                  user: OliverPerring
                  template: classic
                  base: ""

                  # Organization activity
                  plugin_activity: yes
                  plugin_activity_days: 30
                  plugin_activity_filter: all
                  plugin_activity_visibility: all
                  plugin_activity_timestamps: yes
                  plugin_activity_skipped: ""

                  # Focus on organizations
                  repositories_affiliations: organization_member
                  repositories_forks: yes

                  filename: assets/org-activity.*

            - name: Setup Python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.9"

            - name: Install dependencies
              run: |
                  pip install requests

            - name: Generate Comprehensive Stats
              env:
                  GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
              run: |
                  python scripts/generate_stats.py

            - name: Commit and push changes
              run: |
                  git config --local user.email "action@github.com"
                  git config --local user.name "GitHub Action"
                  git add assets/
                  git diff --staged --quiet || git commit -m "Update GitHub stats [skip ci]"
                  git push
