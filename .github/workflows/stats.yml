name: Generate Comprehensive GitHub Stats

on:
    schedule:
        - cron: "0 */6 * * *" # Every 6 hours
    workflow_dispatch: # Allow manual triggering
    push:
        branches: [main]

jobs:
    generate-stats:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Generate Language Stats Only
              uses: lowlighter/metrics@latest
              with:
                  token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
                  user: OliverPerring
                  template: classic
                  base: ""
                  config_timezone: Europe/London

                  # Language stats with ALL repos (this is what you want to keep)
                  plugin_languages: yes
                  plugin_languages_ignored: tex, less, dockerfile, makefile, qmake, lex, cmake, gnuplot
                  plugin_languages_skipped: lowlighter
                  plugin_languages_details: bytes-size, percentage, lines
                  plugin_languages_sections: most-used
                  plugin_languages_indepth: yes
                  plugin_languages_analysis_timeout: 10
                  plugin_languages_categories: markup, programming
                  plugin_languages_limit: 10

                  # Include all repositories (private, forks, etc.)
                  repositories_affiliations: owner, collaborator, organization_member
                  repositories_forks: yes

                  # Output settings
                  filename: assets/languages.*

                  # Custom CSS for theming
                  extras_css: |
                      h2, h3 { color: #58a6ff !important; }
                      .field { border-radius: 6px; }

            - name: Commit and push changes
              run: |
                  git config --local user.email "action@github.com"
                  git config --local user.name "GitHub Action"
                  git add assets/
                  git diff --staged --quiet || git commit -m "Update GitHub stats [skip ci]"
                  git push
